services:
  feishu-platform-ui:
    build: .
    image: feishu-platform-ui:latest
    container_name: feishu-platform-ui
    restart: unless-stopped
    ports:
      - "127.0.0.1:18712:8000"
    volumes:
      - /opt/docker/feishu-relay:/slots/slot1:rw
      - /opt/docker/feishu-platform/slots/slot2:/slots/slot2:rw
      - /opt/docker/feishu-platform/slots/slot3:/slots/slot3:rw
      - /opt/docker/feishu-platform/slots/slot4:/slots/slot4:rw
      - /opt/docker/feishu-platform/slots/slot5:/slots/slot5:rw
      - ./data:/data:rw
      - /opt/docker/feishu-platform-ui:/setup-token-dir:rw
    environment:
      - PYTHONUNBUFFERED=1
    deploy:
      resources:
        limits:
          memory: 128M
    security_opt:
      - no-new-privileges:true
    read_only: true
    tmpfs:
      - /tmp
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
