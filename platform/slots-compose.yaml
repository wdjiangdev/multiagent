services:
  slot1:
    image: feishu-relay:latest
    container_name: feishu-relay-slot1
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    mem_limit: 256m
    environment:
      - PYTHONUNBUFFERED=1
    volumes:
      # President：零拷贝接管既有目录（watermark/seen/inbox 历史全保留）
      - /opt/docker/feishu-relay/config:/app/config:ro
      - /opt/docker/feishu-relay/state:/app/state
      - /opt/docker/feishu-relay/queues:/app/queues
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

